<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Management – Quản lý Nhân sự IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 50:'#f0f4ff', 100:'#dbe4ff', 200:'#bac8ff', 400:'#748ffc', 500:'#4c6ef5', 600:'#4263eb', 700:'#3b5bdb' },
                        surface: { 50:'#f8f9fa', 100:'#f1f3f5', 200:'#e9ecef', 300:'#dee2e6', 400:'#ced4da', 500:'#adb5bd', 600:'#868e96', 700:'#495057', 800:'#343a40', 900:'#212529' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-50 text-surface-800 min-h-screen">

    <!-- Toast -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- Modal -->
    <div id="modal-root" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-40 backdrop-blur-sm"></div>

    <!-- ========== AUTH SCREEN ========== -->
    <div id="auth-screen" class="hidden flex flex-col min-h-screen bg-white">
        <!-- Header for Login -->
        <header class="bg-white border-b border-surface-200 sticky top-0 z-20 shadow-sm">
            <div class="max-w-7xl mx-auto px-6 py-4">
                <div class="flex items-center justify-between">
                    <!-- Logo + Brand -->
                    <div class="flex items-center gap-2 cursor-pointer" id="login-logo-home">
                        <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-primary-600 rounded-lg flex items-center justify-center">
                            <i class="fa-solid fa-building-user text-white text-lg"></i>
                        </div>
                        <span class="text-xl font-bold text-surface-900">
                            <span class="text-primary-500">HR</span>Portal
                        </span>
                    </div>
                    <!-- Back to Home -->
                    <button id="login-back-home-btn" class="text-sm font-medium text-surface-600 hover:text-primary-500 transition flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i>
                        Về trang chủ
                    </button>
                </div>
            </div>
        </header>

        <!-- Login Form -->
        <div class="flex-1 flex items-center justify-center px-6 py-8">
            <div class="w-full max-w-sm">
                <div class="mb-10 text-center">
                    <div class="w-12 h-12 bg-primary-500 rounded-xl flex items-center justify-center mx-auto mb-4">
                        <i class="fa-solid fa-building-user text-white text-lg"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-surface-900">Đăng nhập</h1>
                    <p class="text-sm text-surface-500 mt-1">Hệ thống Quản lý Nhân sự IT</p>
                </div>
                <form id="login-form" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-surface-600 mb-1.5 uppercase tracking-wide">Email</label>
                        <input type="email" id="login-email" required class="input-field" placeholder="ql@gmail.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-surface-600 mb-1.5 uppercase tracking-wide">Mật khẩu</label>
                        <input type="password" id="login-password" required class="input-field" placeholder="••••">
                    </div>
                    <button type="submit" id="login-btn" class="btn-primary w-full">Đăng nhập</button>
                    <p class="text-xs text-center text-surface-400 pt-2">
                        Demo: <span class="text-surface-600 font-medium">ql@gmail.com</span> (Admin) |
                        <span class="text-surface-600 font-medium">kt@gmail.com</span> (Kế toán) |
                        <span class="text-surface-600 font-medium">nv@gmail.com</span> (NV) — MK: <span class="text-surface-600 font-medium">123</span>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- ========== APP SCREEN ========== -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- Header + Content + Footer Container -->
        <div id="app-container" class="flex-1 flex flex-col"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
